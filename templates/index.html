<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wiki Article Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">WikiTool</div>
    </nav>

    <div class="container">
        <div class="card">

            <h2>Wikipedia Article Finder</h2>
            <p class="subtitle">Filter newly created articles by date and category</p>

            <form method="POST">

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" placeholder="e.g. Physics" required>
                </div>

                <button type="submit" class="btn-primary">
                    Search Articles
                </button>

            </form>

        </div>

        {% if articles %}
        <div class="results-card">
            <h3>Results ({{ articles|length }})</h3>

            <table>
                <thead>
                    <tr>
                        <th>Article Title</th>
                    </tr>
                </thead>
                <tbody>
                    {% for article in articles %}
                    <tr>
                        <td>{{ article }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% endif %}

    </div>

</body>
</html>
